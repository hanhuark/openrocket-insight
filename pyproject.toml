[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrocket-insight"
version = "0.1.0a0"
description = "Transparent post-processing for exported OpenRocket simulation results."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "License to be selected before a stable public release."}
authors = [{name = "NED3 Laboratory, University of Arkansas"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openrocket-insight = "openrocket_insight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
